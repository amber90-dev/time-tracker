<div class="container-fluid bg-lsgreen">
    <div class="row ps-4 pe-5 pt-2">
        <p class="text-secondary fs-14">
            <i class="fa-solid fa-gear me-2" id="settings-icon" style="cursor: pointer;"></i> 
            <span id="user-name">Loading...</span> <!-- Placeholder for user name -->
            <i class="fa-regular fa-comment-dots fs-4 float-end" id="chat-icon" style="cursor: pointer;"></i>
        </p>
    </div>
</div>

<script>
    document.getElementById('settings-icon').addEventListener('click', () => {
        // Request main process to open the settings window
        window.api.send('open-settings-window');
    });

    document.getElementById('chat-icon').addEventListener('click', () => {
        window.api.send('logout'); // Request logout
    });
</script>
