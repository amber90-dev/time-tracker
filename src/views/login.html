<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wiserlance - Hourly Auto-Tracked - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .form-check-input:checked {
            background-color: #00C535;
            border-color: #00C535;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="container-flued">
        <div class="row">
            <div class="col-sm-12">
                <div class="bg-dgreen p-3">
                    <span class="float-end text-white pt-1"> Hourly Auto-Tracked</span>
                    <a href="#"><img src="../assests/img/logo-wiserlance.svg" style="width: 130px;"></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Form -->
    <div class="container">
        <div class="row">
            <div class="col-12 p-4 text-center">
                <h5 class="mt-4">Login</h5>
                <p class="fs-14">Please login and start auto tracking your work!</p>
                <form id="loginForm" class="border rounded shadow p-3 mt-4">
                    <input type="text" class="form-control mt-3" id="username" placeholder="User Name" required>
                    <input type="password" class="form-control mt-4" id="password" placeholder="Password" required>
                    <button type="submit" class="btn btn-success bg-green border-0 mt-4 mb-3">Login</button>
                </form>
                <p id="error" style="color: red;"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent default form submission
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Check if the API object is available
            if (window.api) {
                console.log('Sending login request...');
                window.api.send('login', { username, password });
            } else {
                console.error('API is not defined on the window object.');
            }
        });
        // Listen for successful login and store the token
        window.api.receive('login-success', (token) => {
            localStorage.setItem('authToken', token); // Store token in local storage
        });
        window.api.receive('login-error', (errorMessage) => {
            document.getElementById('error').innerText = errorMessage; // Show error message
        });
    </script>
</body>

</html>
