<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wiserlance - Workspace Timesheet Auto-Tracked</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/styles.css">

    <!-- Fonts Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-12">
                <div class="bg-dgreen p-3">
                    <span class="float-end text-white pt-1">   
                        <button id="back-button" class="btn text-white p-0 me-2">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                    </span>
                  
                    <span class="float-end text-white pt-1" id="job-title"></span>
                    <a href="#"><img src="../assests/img/logo-wiserlance.svg" style="width: 130px;"></a>
                </div>
                <h6 class="bg-sgreen p-2">Job Title: <span id="job-title-display"></span></h6> <!-- Updated ID -->
                <div class="d-flex border-bottom pt-1">
                    <div class="col-7">
                        <p class="fs-14">Active Session: <span id="timer"></span><br>
                            Current Week: <span id="hours-worked-week">0h 0m</span> of <span id="total-weekly-hours"></span> hrs<br>
                            Today <span id="current-day"></span>: <span id="hours-worked-today">0h 0m</span><br>
                        </p>
                    </div>
                    <div class="col-5">
                        <div class="form-check form-switch pb-2">
                            <input class="form-check-input fs-2 float-end me-4" type="checkbox" id="mySwitch" name="darkmode" value="yes"><br>
                            <label class="form-check-label fs-12 mt-2" for="mySwitch">Switch your session</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <p class="fs-14 text-secondary mt-2">
                            <span class="fw-bold">Memo:</span>
                            <br>
                            <textarea id="job-memo" class="form-control mt-2" rows="2" maxlength="400" placeholder="Please enter a valid memo (10-30 words)." 
                            required oninput="updateWordCount()"></textarea>
                            <small id="word-count" class="text-muted">0 / 30 words</small>
                            <small id="memo-error" class="text-danger" style="display: none;">Please add a memo (10-30 words) to stop tracking.</small>
                            <!-- <small id="memo-hint" class="text-muted">Press <strong>Enter</strong> to save the memo.</small> -->
                        </p>
                    </div>
                </div>
                <hr>
            </div>
        </div>
        <div class="col-12 bg-sgreen fs-14">
            <p class="bg-sgreen p-2"> <span> </span> <span class="float-start" id="time-since-screenshot"></span></p>
            <div id="screenshots" class="d-flex flex-wrap">
                <!-- Screenshots will be added here -->
            </div>
        </div>
        <div class="text-center" id="timesheet-container">
        <div class="text-center" id="error-div">
        </div>
    </div>
    <script src="job_detail.js"></script>
</body>

</html>
