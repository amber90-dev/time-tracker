<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wiserlance - Workspace Timesheet - Assigned Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/styles.css">

    <!-- Fonts Awesom -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .form-check-input:checked {
            background-color: #00C535;
            border-color: #00C535;
        }

        .bg-lsgreen {
            background-color: #e7f5e9;
        }
    </style>

</head>

<body>

    <!-- Header with Logo and Title -->
    <div class="container-flued">
        <div class="row">
            <div class="col-sm-12">
                <div class="bg-dgreen p-3">
                    <span class="float-end text-white pt-1"> Hourly Auto-Tracked</span>
                    <a href="#"><img src="../assests/img/logo-wiserlance.svg" style="width: 130px;"></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Form and Jobs List -->
    <div class="container">
        <div class="row">
            <div class="px-4">
                <form class="d-flex m-auto my-4 " role="search" style="width:340px;">
                    <input class="form-control bg-white float-end bg-lgreen " style="height:30px; font-size: 14px;"
                        type="search" placeholder="Search Jobs" aria-label="Search">
                    <button class="btn btn-sm ms-1 btn-success bg-dgreen2 border-0 " type="submit"
                        style="height: 30px;">
                        <img src="../assests/img/icons8-search.svg" width="20">
                    </button>
                </form>
                <p class="fs-14 pb-2 mb-2">
                    <span class="text-green">Contracts </span>
                    <span class="float-end">Hours this week</span>
                </p>
            </div>
            <!-- Assigned Jobs List -->
            <ul id="jobs-list">

                <!-- More items will be dynamically added here -->
            </ul>
        </div>
    </div>
    <div id="footer-container"></div> <!-- Placeholder for footer -->

    <script>
        // Dynamically load the footer
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;

                // Add event listeners for settings and logout buttons after loading the footer
                document.getElementById('settings-icon').addEventListener('click', () => {
                    window.api.send('open-settings-window'); // Request to open the settings window
                });

                document.getElementById('logout-icon').addEventListener('click', () => {
                    localStorage.removeItem('authToken'); // Clear the token
                    window.location.href = 'login.html';  // Redirect to login page
                });
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>

    <script src="../jobs.js"></script>
</body>

</html>
